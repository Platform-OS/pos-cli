name: Pos-cli GUI tests
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

# Default for every job below: read this repository's code and nothing else.
permissions:
  contents: read

jobs:
  pre_job:
    runs-on: ubuntu-latest
    # skip-duplicate-actions lists this workflow's previous runs to decide whether the
    # GUI paths changed, which needs read access to the Actions API on top of the default.
    permissions:
      contents: read
      actions: read
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@master
        with:
          github_token: ${{ github.token }}
          paths: '["gui/next/**"]'
          paths_ignore: '["gui/next/README.md"]'

  tests:
    needs: ["pre_job"]
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
    env:
      MPKIT_EMAIL: ${{ secrets.MPKIT_EMAIL }}
      MPKIT_TOKEN: ${{ secrets.MPKIT_TOKEN }}
      MPKIT_URL: ${{ secrets.MPKIT_URL }}
      CI: true
    steps:
      - name: Checkout test instance code
        uses: actions/checkout@v7
        with:
          repository: Platform-OS/pos-cli-gui-qa
          path: instance
      - name: Checkout pos-cli code
        uses: actions/checkout@v7
        with:
          path: pos-cli
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pos-cli
        run: |
          npm install -g @platformos/pos-cli
      - name: Seed the test instance with test data
        working-directory: ./instance
        timeout-minutes: 6
        shell: sh
        run: |
          set -eu
          pos-cli deploy
          pos-cli data clean --auto-confirm
          pos-cli data import --path=seed/data.zip --zip
      - name: Build GUI
        working-directory: ./pos-cli/gui/next
        shell: sh
        run: |
          set -eu
          npm install
          npm run build
      # - name: Install Playwright browsers
      #   run: npx playwright install --with-deps
      - name: Run express server, vite preview server and tests
        working-directory: ./pos-cli/gui/next
        shell: sh
        run: |
          set -eu
          # --host 127.0.0.1, not the default name "localhost": the container resolves localhost
          # to ::1 first, so express bound IPv6-only while node's fetch resolved the same name to
          # 127.0.0.1 and got ECONNREFUSED. undici does not fall back to the other family, so the
          # two ends have to agree on a literal address rather than both trusting the resolver.
          pos-cli gui serve --host 127.0.0.1 &
          npm run preview &
          # Wait for the API server to answer instead of assuming 5s is enough. node, not curl:
          # setup-node guarantees it, and this is the exact client the tests use.
          for _ in $(seq 1 60); do
            if node -e "fetch('http://127.0.0.1:3333/info').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              break
            fi
            sleep 1
          done
          npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ./pos-cli/gui/next/test-results/
          retention-days: 4
